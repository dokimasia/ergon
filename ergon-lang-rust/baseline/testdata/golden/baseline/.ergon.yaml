rust:
  # The tools of the targets of Rust, which ergon tool run installs with cargo install --locked, as
  # <crate>@<version>.
  tools:
    # The vulnerability scan of audit-rust, over Cargo.lock.
    cargo-audit: cargo-audit@0.22.2
  # The steps that check-rust runs, in order: lint, test, generate or audit.
  check: [lint, test, audit]
  # test-rust runs cargo test with args.
  test:
    args: [--all-targets]
  # generate-rust runs command with args at the root of the repository. verify-generate-rust, the
  # step generate of check, runs the same and fails when the run changes a file of the repository.
  # Without a command Rust has neither target.
  generate:
    command: []
    args: []
  # audit-rust scans Cargo.lock with cargo-audit, and accepts each advisory of ignore, by its
  # identifier, such as RUSTSEC-2024-0001.
  audit:
    ignore: []
  # The pin of setup-rust-toolchain, the runners and the toolchains of Rust of the job check-rust,
  # and its limit in minutes. Empty runners select every runner of the section github, and empty
  # versions the toolchain of rust-toolchain.toml.
  ci:
    actions:
      # The action that installs the toolchain of Rust of rust-toolchain.toml or of the matrix, with
      # rustfmt and clippy.
      setup-rust-toolchain:
        uses: actions-rust-lang/setup-rust-toolchain
        commit: ecabd13d1c56bd1345c230e542e9144811ad706f
        release: v2.0.0
    runners: []
    versions: []
    timeout: 30
