# The binaries of a release of ergon: the archives of the command ergon for each system and
# architecture, and checksums.txt, which GoReleaser attaches to the GitHub Release of the tag
# v<version> of the root module. release.yml calls the workflow after a publish that released the
# root module, because a tag that GITHUB_TOKEN creates does not start a workflow. A push of the tag
# from a workstation starts it when the push has at most three tags, because GitHub creates the
# events of the tags of a push only then. After a publish of more tags from a workstation, run
# gh workflow run binaries.yml --ref v<version>.

name: Binaries

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_call:
  workflow_dispatch:

permissions: {}

# Every command runs in bash.
defaults:
  run:
    shell: bash

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the tag of the root module
        run: |
          tags="$(git tag --points-at HEAD --list 'v[0-9]*')"
          if [ "$(printf '%s\n' "$tags" | grep -c .)" -ne 1 ]; then
            echo "::error::HEAD has no tag of the root module, or more than one: ${tags:-none}"
            exit 1
          fi
          echo "GORELEASER_CURRENT_TAG=$tags" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
