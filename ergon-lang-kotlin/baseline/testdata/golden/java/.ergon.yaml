jvm:
  # The tools of the targets that Java and Kotlin share.
  tools:
    # The release of osv-scanner, the vulnerability scan of audit-jvm, over the Gradle lockfiles.
    osv-scanner:
      sha256:
        darwin/arm64: 98c460dcd37de25819babd757d04542045b6243113e209edcd4d89fedb0256b4
        linux/amd64: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        windows/amd64: e0ed7644118b717b028c249ee9d3515024e55e8510747ca08906eb96765354d6
      version: 2.6.0
  # The pin of setup-java, the runners and the versions of Java of the jobs check-java and
  # check-kotlin, and their limit in minutes. Empty runners select every runner of the section
  # github, and empty versions the Java of .java-version.
  ci:
    actions:
      # The action that installs the Temurin build of the Java of .java-version or of the matrix.
      setup-java:
        uses: actions/setup-java
        commit: de7274f081f381c8f8158605e0321c36c376e2e6
        release: v6.0.1
    runners: []
    versions: []
    # The steps that each job of the toolchain runs after the setup of the toolchain and before
    # ergon, such as the installation of a compiler that the tests run. A step has the keys name,
    # id, if and env, and either uses with its inputs under with, or run. uses is an action as uses,
    # commit and release, and each input is a string. run is the list of the lines of a command of
    # bash.
    steps: []
    timeout: 30
java:
  # The tools of the targets of Java: PMD as <group>:<artifact>@<version> of Maven Central, and the
  # release binary of google-java-format by its version and the SHA-256 of the asset of each
  # platform.
  tools:
    # The PMD of lint-java, which the PMD plugin of Gradle runs with the rule sets of rulesets. The
    # plugin runs net.sourceforge.pmd:pmd-java, so the tool accepts another version of it and no
    # other artifact.
    pmd: net.sourceforge.pmd:pmd-java@7.28.0
    # The release of google-java-format, the formatter of fmt-java and lint-java, in Google Java
    # Style.
    google-java-format:
      sha256:
        darwin/arm64: 657cf1011c8dfb7e0dac08516db02b701436e59600b961077f83b89b69cc3495
        linux/amd64: 881821ffd1a52b175886c4ebeeacce2ba5b5d7326b52d32a18d384d8a783bd77
        windows/amd64: 48260bed87f6830bae44a7a27f66ce98f7d9fb245f500021bd7ae16c9e2daa06
      version: 1.37.0
  # The rule sets of PMD that lint-java checks the Java sources with. A rule set is the path of a
  # rule set file of the repository, relative to its root, such as config/pmd.xml, or a rule set of
  # PMD, such as its base ruleset rulesets/java/quickstart.xml or the category
  # category/java/bestpractices.xml. A rule set file can refer to a rule set of PMD and exclude some
  # of its rules.
  rulesets: [rulesets/java/quickstart.xml]
  # The steps that check-java runs, in order: lint, test, generate or audit. audit runs audit-jvm of
  # the section jvm.
  check: [lint, test, audit]
  # test-java runs ./gradlew test with args.
  test:
    args: []
  # generate-java runs each command line of commands in order at the root of the repository, such as
  # ./gradlew with a task of a generator. verify-generate-java, the step generate of check, runs the
  # same and fails when the run changes a file of the repository. Without a command line Java has
  # neither target.
  generate:
    commands: []
kotlin:
  # The tools of the targets of Kotlin, as <group>:<artifact>@<version> of Maven Central.
  tools:
    # The ktlint of fmt-kotlin and lint-kotlin, with the rules of the section of Kotlin of
    # .editorconfig. ergon tool run runs the jar of com.pinterest.ktlint:ktlint-cli with its
    # dependencies, so the tool accepts another version of it and no other artifact.
    ktlint: com.pinterest.ktlint:ktlint-cli@1.8.0
  # The steps that check-kotlin runs, in order: lint, test, generate or audit. audit runs audit-jvm
  # of the section jvm.
  check: [lint, test, audit]
  # test-kotlin runs ./gradlew test with args.
  test:
    args: []
  # generate-kotlin runs each command line of commands in order at the root of the repository, such
  # as ./gradlew with a task of a generator. verify-generate-kotlin, the step generate of check,
  # runs the same and fails when the run changes a file of the repository. Without a command line
  # Kotlin has neither target.
  generate:
    commands: []
