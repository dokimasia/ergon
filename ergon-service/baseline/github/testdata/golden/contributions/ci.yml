# Managed by ergon init. Add repository settings to .ergon/local/.github/workflows/ci.yml and run ergon init sync.
#
# The gate of the repository, with the jobs that each producer of ergon init contributes. A check
# of text runs on the Linux runner of the section github of .ergon.yaml, and every other job on a
# matrix of runners. A job that sets up a toolchain runs its steps once the repository has the
# files of the toolchain, and sets the toolchain up before ergon. A job that runs tools keeps the
# tools of ergon in the cache of GitHub Actions. version.yml opens the version pull request after
# the run of a push to main passes, and release.yml publishes a commit only when a run of the gate
# passed on its content. A new run of a pull request cancels its earlier run, and every other run
# has a concurrency group of its own.
#
# The job skip runs first. Every other job skips when a passed run already covers the content of
# the run: a push whose content passed, such as the merge of a pull request whose run passed, and a
# version commit whose parent passed, which version.yml marks with the status ergon/version. The
# job result passes when every job passed or skipped, so it is the one check that a branch requires.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every command runs in bash, which is Git Bash on Windows.
defaults:
  run:
    shell: bash

jobs:
  skip:
    name: Skip a tested commit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Find a passed run that covers the content
        id: skip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ergon release ci skip --commit "$COMMIT"

  baseline:
    name: Baseline
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Check the managed files
        run: |
          ergon init check

  check-alpha:
    name: "Alpha (${{ matrix.os }}, ${{ matrix.version }})"
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
        version: ["1.0", "2.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ALPHA_HOME: /opt/alpha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: "hashFiles('alpha.lock') != ''"
        uses: ./.github/actions/setup-make
      - name: Set up alpha
        if: "hashFiles('alpha.lock') != ''"
        uses: alpha-lang/setup-alpha@0123456789abcdef0123456789abcdef01234567 # v1.2.3
        with:
          cache: "false"
          version: "${{ matrix.version }}"
      - if: "hashFiles('alpha.lock') != ''"
        uses: ./.github/actions/setup-ergon
      - name: Keep the tools of ergon
        if: "hashFiles('alpha.lock') != ''"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "ergon-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.version }}-${{ hashFiles('.ergon.yaml', '.ergon/init.lock') }}"
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/ergon/tools' || runner.os == 'macOS' && '~/Library/Caches/ergon/tools' || '~/.cache/ergon/tools' }}"
      - name: Check alpha
        if: "hashFiles('alpha.lock') != '' && (github.event_name != 'schedule')"
        run: |
          make check-alpha

  check-beta:
    name: "Beta (${{ matrix.os }})"
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-make
      - uses: ./.github/actions/setup-ergon
      - run: |
          make check-beta

  lint-text:
    name: Text
    needs: skip
    if: "needs.skip.outputs.skip != 'true' && (github.event_name == 'pull_request')"
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Keep the tools of ergon
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "ergon-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('.ergon.yaml', '.ergon/init.lock') }}"
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/ergon/tools' || runner.os == 'macOS' && '~/Library/Caches/ergon/tools' || '~/.cache/ergon/tools' }}"
      - env:
          BASE: main
        run: |
          ergon tool run tool.lint

  steps:
    name: "Steps (${{ matrix.os }})"
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: |
          echo version=1 >> "$GITHUB_OUTPUT"
      - if: "steps.pin.outputs.version == '1'"
        uses: alpha-lang/setup-alpha@0123456789abcdef0123456789abcdef01234567 # v1.2.3
      - uses: alpha-lang/setup-alpha@0123456789abcdef0123456789abcdef01234567 # v1.2.3
        with:
          globs: "**/*.md\n#node_modules"
      - name: Report
        env:
          VERSION: "${{ steps.pin.outputs.version }}"
        run: |
          if [ -n "$VERSION" ]; then
            echo "$VERSION"
          fi

  result:
    name: Result
    if: always()
    needs: [skip, baseline, check-alpha, check-beta, lint-text, steps]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Require every job to pass or to skip
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
