github:
  # The runner images of the jobs that run on every runner, each pinned to a version of its system.
  # The key ci.runners of a section lists a part of them.
  runners: [ubuntu-26.04, macos-26, windows-2025]
  # The runner image of the jobs that check text and of the analyses of CodeQL, one of runners.
  linux: ubuntu-26.04
  # The release of GNU make that the action setup-make installs from Chocolatey on a Windows runner,
  # whose image has no make.
  make: 4.4.1
  # The options of nightly.yml, which runs the steps under the key nightly of each language on a
  # schedule, each in a job of its own.
  nightly:
    # When nightly.yml runs, as a cron expression of five fields in UTC, such as 0 3 * * * for 03:00
    # each day.
    schedule: 0 3 * * *
  # The pins of the actions of the workflows, and the limit in minutes of each job of the GitHub
  # files.
  ci:
    actions:
      # The action that checks out the repository in every job of every workflow.
      checkout:
        uses: actions/checkout
        commit: 3d3c42e5aac5ba805825da76410c181273ba90b1
        release: v7.0.1
      # The actions of CodeQL. init and analyze run the analysis of each language in codeql.yml, and
      # upload-sarif uploads the results of the Scorecard.
      codeql:
        uses: github/codeql-action
        commit: 2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        release: v4.38.2
      # The action that reviews the dependencies that a pull request changes, in the job
      # dependency-review of security.yml.
      dependency-review:
        uses: actions/dependency-review-action
        commit: a1d282b36b6f3519aa1f3fc636f609c47dddb294
        release: v5.0.0
      # The action of the OpenSSF Scorecard, in the weekly job scorecard of security.yml.
      scorecard:
        uses: ossf/scorecard-action
        commit: 2d1146689b8cda280b9bc96326124645441f03bc
        release: v2.4.4
      # The action that uploads the publish plan of the job select-mode and the artifacts of the job
      # pack of release.yml.
      upload-artifact:
        uses: actions/upload-artifact
        commit: cf430e030ddbb5b0abf93d22962f4752f3646cd9
        release: v7.0.2
      # The action that downloads the publish plan in the job pack, and the artifacts in the job
      # publish of release.yml.
      download-artifact:
        uses: actions/download-artifact
        commit: 9000827ccba6bdab643e8b6fd33ac0654aef8333
        release: v8.0.2
      # The action that restores the tool directory of ergon before the steps of each job of ci.yml
      # that runs tools, and saves it after a run that succeeds.
      cache:
        uses: actions/cache
        commit: 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        release: v6.1.0
      # The action that creates a token of the GitHub App of the variable ERGON_APP_CLIENT_ID and
      # the secret ERGON_APP_PRIVATE_KEY in version.yml, whose pull request then runs its checks
      # without an approval.
      create-github-app-token:
        uses: actions/create-github-app-token
        commit: bcd2ba49218906704ab6c1aa796996da409d3eb1
        release: v3.2.0
    timeout: 15
