# Managed by ergon init. Add repository settings to .ergon/local/.github/workflows/release.yml and run ergon init sync.
#
# The release flow of the packages of the repository on every push to main. The job select-mode
# chooses the next job. While main has changesets, the job version opens or updates the version
# pull request. After the merge of that pull request, the jobs ci, pack and publish release each
# package of the publish plan. The jobs version and pack set up the toolchains of the repository
# before ergon, which refresh the lockfiles and build the artifacts.

name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Every command runs in bash.
defaults:
  run:
    shell: bash

jobs:
  select-mode:
    name: Select the mode
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Select the mode
        id: mode
        run: |
          ergon release ci select-mode --output publish-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-plan
          path: publish-plan.json
          if-no-files-found: error

  version:
    name: Version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Open the version pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ergon release ci version

  ci:
    name: CI
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  pack:
    name: Pack
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-plan
      - name: Pack the packages
        run: |
          ergon release pack --from-publish-plan publish-plan.json --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            publish-plan.json
            dist
          if-no-files-found: error

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Publish the packages
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ergon release publish --from-publish-plan publish-plan.json --from-pack-dir dist
