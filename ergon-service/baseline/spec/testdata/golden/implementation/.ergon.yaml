spec:
  # The tools of spec.
  tools:
    # The release of spec, which checks the copies of the definitions and the manifest of a
    # definition.
    spec:
      sha256:
        darwin/amd64: af667806ff4d1b98975dbf25d9994748edc9abc0c8b170ea478365fe86d7ace3
        darwin/arm64: ab07badc7456450212860080aa8b4c17b490b7bf94578c1f552307b6cfeb287b
        linux/amd64: 52c6e38ae99491e5cbeaf5e48ffb7aeec7a4ab432a9f925d5f63788cdafdfba6
        linux/arm64: 533883b706ebb63501d3791f37e74d6b50dfa5707b59e641ce6415dea5af6443
        windows/amd64: d3ca18f4ec1991867e6bf3ecad3ad963754f1c8deae0cfb42fd46d42552a39f2
        windows/arm64: fcbeb31e10146308d86f2682016f70fd7eb2a4b76ba2f72a4ced9118e9976c88
      version: 0.4.0
  # What the repository is to spec: definition for the repository of a conformance definition, and
  # implementation for a repository with copies of definitions. Each role needs its section of
  # .spec.yaml, definition or implements. A repository without a role gets no target or job of spec.
  roles: [implementation]
  # The limit in minutes of the job spec of ci.yml and of the job propose-spec of nightly.yml. The
  # jobs run spec through ergon, and they do not run an action of their own.
  ci:
    actions: {}
    timeout: 10
