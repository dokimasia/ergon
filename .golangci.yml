# Managed by ergon init, with .ergon/local/.golangci.yml merged in. Change the repository's settings there and run ergon init sync.
#
# The configuration of golangci-lint for every module of the repository. It enables each linter
# that a Go repository of the baseline enables, with the strictest setting that one of them uses.
# A repository adds its own settings in its local file, which merges into this one: maps key by
# key, lists appended. The depguard rules of the repository's module boundaries go there.

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  relative-path-mode: gomod
output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - mirror
    - noctx
    - perfsprint
    - prealloc
    # Architecture and style
    - decorder
    - depguard
    - dupl
    - dupword
    - forbidigo
    - funcorder
    - goconst
    - interfacebloat
    - misspell
    - musttag
    - nolintlint
    - revive
    - sloglint
    - usestdlibvars
    - whitespace
    - wrapcheck
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    # Test hygiene
    - paralleltest
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting
    # The module plugins of go.lint.plugins, which ergon tool run builds into golangci-lint
    - assertlint
  settings:
    asasalint:
      use-builtin-exclusions: true
    copyloopvar:
      check-alias: true
    # golangci-lint loads each module plugin of go.lint.plugins from its program. A repository
    # sets the settings of a plugin in its local file, under the name of the plugin.
    custom:
      assertlint:
        type: module
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false
    # depguard allows only the standard library in a module without rules, so this rule denies
    # the packages that the standard library or a successor replaces, and allows everything else.
    # A repository adds the rules of its module boundaries in its local file.
    depguard:
      rules:
        replaced:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: io/ioutil$
              desc: io/ioutil is deprecated, so use io and os
            - pkg: github.com/pkg/errors
              desc: wrap with fmt.Errorf and %w, and match with errors.Is and errors.As
            - pkg: golang.org/x/exp/slices$
              desc: use slices of the standard library
            - pkg: golang.org/x/exp/maps$
              desc: use maps of the standard library
            - pkg: golang.org/x/net/context$
              desc: use context of the standard library
            - pkg: github.com/golang/protobuf
              desc: github.com/golang/protobuf is deprecated, so use google.golang.org/protobuf
        # core declares the vocabulary and the catalog, and imports nothing else of ergon.
        core:
          files: ["**/ergon-core/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/ergon/core
        # service is the language-neutral side of each command. It imports core, and calls a
        # language through the roles of the catalog.
        service:
          files: ["**/ergon-service/**"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/ergon/core
            - go.dokimi.dev/ergon/service
            # The YAML of the configured files and of the local files, with its comments.
            - go.yaml.in/yaml/v3
            # The configuration of ergon, which viper parses and decodes into the options of each
            # producer.
            - github.com/spf13/viper
            - github.com/go-viper/mapstructure/v2
            # The TOML that the test kit of the producers parses, such as ruff.toml.
            - github.com/pelletier/go-toml/v2
            # The comment styles, the check and the insertion of the license headers, the logger
            # that the license headers silence, and the globs of the files without a header.
            - github.com/apache/skywalking-eyes
            - github.com/sirupsen/logrus
            - github.com/bmatcuk/doublestar/v4
            # The paths and the pseudo-versions of Go modules, which a baseline update resolves
            # through a module proxy.
            - golang.org/x/mod
            # The .tar.xz archives of release binaries, such as the Linux programs of UPX.
            - github.com/ulikunitz/xz
        # The package licenses is the one package of the repository that imports skywalking-eyes and
        # its logger.
        license-library:
          files: ["**/*.go", "!**/ergon-service/licenses/*.go"]
          list-mode: lax
          deny:
            - pkg: github.com/apache/skywalking-eyes
              desc: only the package licenses of ergon-service imports skywalking-eyes
            - pkg: github.com/sirupsen/logrus
              desc: only the package licenses of ergon-service silences the logger of skywalking-eyes
        # The production files of a language module import core and the module's own packages, and
        # no other language module. The own packages are allowed as the root package and as the
        # prefix with a slash, so the Java module's rule does not allow the JavaScript module.
        csharp-module:
          files: ["**/ergon-lang-csharp/**", "!$test"]
          list-mode: strict
          allow: [$gostd, go.dokimi.dev/ergon/core, go.dokimi.dev/ergon/lang/csharp$, go.dokimi.dev/ergon/lang/csharp/]
        java-module:
          files: ["**/ergon-lang-java/**", "!$test"]
          list-mode: strict
          allow: [$gostd, go.dokimi.dev/ergon/core, go.dokimi.dev/ergon/lang/java$, go.dokimi.dev/ergon/lang/java/]
        php-module:
          files: ["**/ergon-lang-php/**", "!$test"]
          list-mode: strict
          allow: [$gostd, go.dokimi.dev/ergon/core, go.dokimi.dev/ergon/lang/php$, go.dokimi.dev/ergon/lang/php/]
        javascript-module:
          files: ["**/ergon-lang-javascript/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/ergon/core
            - go.dokimi.dev/ergon/lang/javascript$
            - go.dokimi.dev/ergon/lang/javascript/
        # The analyzers of ergon-go-vet read the syntax and the types of Go, and run on
        # golang.org/x/tools, whose multichecker runs them and whose go/packages resolves the
        # patterns of -exclude. A release reads and writes go.work and go.mod, and writes the zips
        # of the released modules, with golang.org/x/mod. The packer reads the dist directory from
        # the GoReleaser configuration of each module with go.yaml.in/yaml/v3.
        go-module:
          files: ["**/ergon-lang-go/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - go/ast
            - go/constant
            - go/types
            - go.dokimi.dev/ergon/core
            - go.dokimi.dev/ergon/lang/go$
            - go.dokimi.dev/ergon/lang/go/
            - golang.org/x/mod
            - golang.org/x/tools
            - go.yaml.in/yaml/v3
        python-module:
          files: ["**/ergon-lang-python/**", "!$test"]
          list-mode: strict
          allow: [$gostd, go.dokimi.dev/ergon/core, go.dokimi.dev/ergon/lang/python$, go.dokimi.dev/ergon/lang/python/]
        rust-module:
          files: ["**/ergon-lang-rust/**", "!$test"]
          list-mode: strict
          allow: [$gostd, go.dokimi.dev/ergon/core, go.dokimi.dev/ergon/lang/rust$, go.dokimi.dev/ergon/lang/rust/]
        terraform-module:
          files: ["**/ergon-lang-terraform/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/ergon/core
            - go.dokimi.dev/ergon/lang/terraform$
            - go.dokimi.dev/ergon/lang/terraform/
        bash-module:
          files: ["**/ergon-lang-bash/**", "!$test"]
          list-mode: strict
          allow: [$gostd, go.dokimi.dev/ergon/core, go.dokimi.dev/ergon/lang/bash$, go.dokimi.dev/ergon/lang/bash/]
        # TypeScript and Kotlin also import the root package of the module that declares their
        # toolchain, for the name of the toolchain.
        typescript-module:
          files: ["**/ergon-lang-typescript/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/ergon/core
            - go.dokimi.dev/ergon/lang/typescript$
            - go.dokimi.dev/ergon/lang/typescript/
            - go.dokimi.dev/ergon/lang/javascript$
        kotlin-module:
          files: ["**/ergon-lang-kotlin/**", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/ergon/core
            - go.dokimi.dev/ergon/lang/kotlin$
            - go.dokimi.dev/ergon/lang/kotlin/
            - go.dokimi.dev/ergon/lang/java$
        # The tests of a language module import core, their own package, the module of their
        # toolchain, and the packages of ergon init in service: the test kit, which renders the
        # language as ergon init new does, the engine of the templates, and the producer of the
        # GitHub files, which renders the contribution of the language. The tests of the release
        # roles read real repositories through the git of service and its test kit. The tests of the
        # analyzers of the Go module run them with the test kit of golang.org/x/tools. depguard
        # matches a file against any entry of files, so the globs name the test files of the
        # language modules.
        language-module-tests:
          files: ["**/ergon-lang-*/*_test.go", "**/ergon-lang-*/**/*_test.go"]
          list-mode: strict
          allow:
            - $gostd
            - go.dokimi.dev/assert
            - go.dokimi.dev/ergon/core
            - go.dokimi.dev/ergon/lang
            - go.dokimi.dev/ergon/service/baseline
            - go.dokimi.dev/ergon/service/vcs
            - golang.org/x/mod
            - golang.org/x/tools/go/analysis
    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: return an error instead of a panic
        - pattern: ^(fmt\.(Print|Printf|Println)|print|println)$
          msg: write to an io.Writer that the caller passes, or log through log/slog
    funcorder:
      constructor: true
      struct-method: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
    govet:
      enable-all: true
    interfacebloat:
      max: 10
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: blank-imports
        # thelper requires the test first in a helper, so a helper takes its context second.
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redundant-import-alias
        - name: time-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: var-naming
    # revive checks the package comments and the names, so staticcheck runs every other check.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    # Every test file declares the package x_test, so a test calls only what its package exports.
    # The pattern matches no file name, and an empty pattern would match every one.
    testpackage:
      skip-regexp: "^$"
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true
    whitespace:
      multi-if: true
      multi-func: false
    # An error that the constructor of an error, a wrap, a join or a context returns already
    # carries its cause, and a walk of a file tree returns the error of the caller's own function,
    # so neither needs a second wrap.
    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
        - context\.Cause\(
        - (fs|filepath)\.WalkDir\(
        - filepath\.Walk\(
      ignore-package-globs:
        - go.dokimi.dev/ergon/*
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - (^|/)testdata($|/)
    rules:
      # A table or a fixture of a test exists once per test, so its layout and its size do not
      # matter.
      - path: _test\.go$
        linters: [govet]
        text: "fieldalignment:"
      - path: _test\.go$
        linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # A test states its values inline, because the value is the assertion.
      - path: _test\.go$
        linters: [goconst, gosec]
      # A failed type assertion or an unused parameter in a test fails the test, which is the
      # signal these linters exist for.
      - path: _test\.go$
        linters: [forcetypeassert, unparam]
      # A test file puts its fakes and helpers below the tests that use them, in reading order.
      - path: _test\.go$
        linters: [funcorder]
      # A fake of a test returns a nil value with a nil error on purpose, to prove the guard
      # against a broken value-or-error contract.
      - path: _test\.go$
        linters: [nilnil]
      # A spec mirrors its source file, so the specs of two similar files repeat each other.
      - path: _test\.go$
        linters: [dupl]
      # A test and the code of a generator return the errors of the code that they call unchanged.
      # A test checks such an error with errors.Is, and a generator has no context to add.
      - path: (_test|[._]gen)\.go$
        linters: [wrapcheck]
      # A test of an allocation ceiling, of an environment variable or of the test binary as a
      # process runs serially, and its name ends in Allocs, Env or Process.
      # testing.AllocsPerRun and t.Setenv panic in a parallel test, and two processes that exit
      # in the same nanosecond write one coverage file.
      - path: _test\.go$
        linters: [paralleltest, tparallel]
        text: 'Test\w*(Allocs|Env|Process)\b'
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  # gci groups the standard library apart from every other import. A repository puts its own
  # modules in a group of their own by adding gci's sections in its local file, such as standard,
  # default and the prefix of its module paths.
  settings:
    gofumpt:
      extra:
        group-params: true
    golines:
      max-len: 120
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false
severity:
  default: error
