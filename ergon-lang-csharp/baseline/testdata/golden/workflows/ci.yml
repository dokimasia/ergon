# Managed by ergon init. Add repository settings to .ergon/local/.github/workflows/ci.yml and run ergon init sync.
#
# The gate of the repository, with the jobs that each producer of ergon init contributes. A check
# of text runs on the Linux runner of the section github of .ergon.yaml, and every other job on a
# matrix of runners. A job that sets up a toolchain runs its steps once the repository has the
# files of the toolchain, and sets the toolchain up before ergon. A job that runs tools keeps the
# tools of ergon in the cache of GitHub Actions. release.yml calls the gate before it publishes a
# release.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:

permissions: {}

# A run that release.yml calls has the workflow of its caller, so the group starts with ci to keep
# it apart from the group of the caller.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every command runs in bash, which is Git Bash on Windows.
defaults:
  run:
    shell: bash

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ergon
      - name: Check the managed files
        run: |
          ergon init check

  check-csharp:
    name: "C# (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: "hashFiles('global.json') != ''"
        uses: ./.github/actions/setup-make
      - name: Set up .NET
        if: "hashFiles('global.json') != ''"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - if: "hashFiles('global.json') != ''"
        uses: ./.github/actions/setup-ergon
      - name: "Check C#"
        if: "hashFiles('global.json') != ''"
        run: |
          make check-csharp
