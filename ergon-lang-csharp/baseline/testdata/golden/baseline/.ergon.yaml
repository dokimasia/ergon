csharp:
  # The steps that check-csharp runs, in order: lint, test, generate or audit.
  check: [lint, test, audit]
  # test-csharp runs dotnet test with args.
  test:
    args: []
  # generate-csharp runs command with args at the root of the repository. verify-generate-csharp,
  # the step generate of check, runs the same and fails when the run changes a file of the
  # repository. Without a command C# has neither target.
  generate:
    command: []
    args: []
  # audit-csharp fails on a known vulnerability of a NuGet package of severity or above: low,
  # moderate, high or critical.
  audit:
    severity: low
  # The pin of setup-dotnet, the runners and the versions of the .NET SDK of the job check-csharp,
  # and its limit in minutes. Empty runners select every runner of the section github, and empty
  # versions the SDK of global.json.
  ci:
    actions:
      # The action that installs the .NET SDK of global.json or of the matrix.
      setup-dotnet:
        uses: actions/setup-dotnet
        commit: a98b56852c35b8e3190ac28c8c2271da59106c68
        release: v6.0.0
    runners: []
    versions: []
    # The steps that each job of the toolchain runs after the setup of the toolchain and before
    # ergon, such as the installation of a compiler that the tests run. A step has the keys name,
    # id, if and env, and either uses with its inputs under with, or run. uses is an action as uses,
    # commit and release, and each input is a string. run is the list of the lines of a command of
    # bash.
    steps: []
    timeout: 30
