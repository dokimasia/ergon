python:
  # The tools of the targets of Python: the release binary of uv, and the packages of PyPI that
  # ergon tool run runs through it, as <package>@<version>.
  tools:
    # The release of uv, which installs Python and the environment of the project, and runs the
    # packages of PyPI of the section.
    uv:
      sha256:
        darwin/arm64: 743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73
        linux/amd64: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
        windows/amd64: a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a
      version: 0.13.5
    # The linter and the formatter of lint-python and fmt-python, with the rules of ruff.toml.
    ruff: ruff@0.17.1
    # The type checker of lint-python, in its strictest mode, in the environment of the project.
    mypy: mypy@2.4.0
    # The test runner of test-python, in the environment of the project.
    pytest: pytest@9.1.1
    # The vulnerability scan of audit-python, over the packages of uv.lock.
    pip-audit: pip-audit@2.10.1
  # The paths that ruff and mypy check.
  paths: [.]
  # The steps that check-python runs, in order: lint, test, generate or audit.
  check: [lint, test, audit]
  # test-python runs pytest with args.
  test:
    args: []
  # generate-python runs each command line of commands in order at the root of the repository.
  # verify-generate-python, the step generate of check, runs the same and fails when the run changes
  # a file of the repository. Without a command line Python has neither target.
  generate:
    commands: []
  # audit-python scans the packages of uv.lock with pip-audit, and accepts each advisory of ignore,
  # by its identifier, such as PYSEC-2024-1.
  audit:
    ignore: []
    # The packages of uv.lock without a release on PyPI, such as a package from a git repository or
    # from another index. audit-python leaves them out of the scan, because pip-audit fails for
    # them.
    skip: []
  # The runners and the versions of Python of the job check-python, and its limit in minutes. uv
  # installs Python, so the job runs no action of its own. Empty runners select every runner of the
  # section github, and empty versions the version of pyproject.toml.
  ci:
    actions: {}
    runners: []
    versions: []
    # The steps that each job of the toolchain runs after the setup of the toolchain and before
    # ergon, such as the installation of a compiler that the tests run. A step has the keys name,
    # id, if and env, and either uses with its inputs under with, or run. uses is an action as uses,
    # commit and release, and each input is a string. run is the list of the lines of a command of
    # bash.
    steps: []
    timeout: 30
