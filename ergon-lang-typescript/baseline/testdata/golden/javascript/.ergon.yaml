js:
  # The package manager of the packages of package.json: npm, which installs package-lock.json, or
  # pnpm, which installs pnpm-lock.yaml. It runs the test script and the scan of the packages, and
  # ergon tool run starts the npm packages of every section with npx or with pnpm dlx.
  package-manager: npm
  # The toolkit of fmt-js, lint-js and the tests: biome or vite-plus. biome formats and lints with
  # the managed biome.json, checks the types of TypeScript with tsc and runs the test script.
  # vite-plus runs vp fmt, vp check and vp test --run of the packages of the repository with the
  # configuration of vite.config.ts, and ergon init renders .prettierignore in place of biome.json.
  toolkit: biome
  # The tools of the targets that JavaScript and TypeScript share and of a release, as
  # <package>@<version> of npm, which ergon tool run starts with the package manager.
  tools:
    # The linter and the formatter of lint-js and fmt-js, with the rules of biome.json, for the
    # toolkit biome.
    biome: '@biomejs/biome@2.5.15'
    # The npm that uploads the tarballs of a release to the npm registry in the job publish of
    # release.yml. The trusted publishing of npm needs npm 11.5.1 or later.
    npm: npm@12.2.1
  # The paths that Biome formats and checks. vp reads its paths from vite.config.ts.
  paths: [.]
  # The globs of the paths that fmt-js and lint-js skip. Each glob is relative to the root of the
  # repository. The glob vendor matches the directory vendor, and src/**/*.gen.ts matches the files
  # below src that end in .gen.ts. A glob has * inside a segment and ** only as a whole segment.
  # biome skips the paths through files.includes of biome.json. vite-plus skips them through
  # .prettierignore in vp fmt and in the format check of vp check, and through .eslintignore in the
  # lint of vp check.
  exclude: []
  # audit-js fails on a known vulnerability of a package of the lockfile of severity or above: low,
  # moderate, high or critical.
  audit:
    severity: low
  # The pins of setup-node and pnpm/setup, the runners and the versions of Node.js of the jobs
  # check-javascript and check-typescript, and their limit in minutes. Empty runners select every
  # runner of the section github, and empty versions the Node.js of package.json.
  ci:
    actions:
      # The action that installs the Node.js of package.json or of the matrix, with npm, for the
      # package manager npm.
      setup-node:
        uses: actions/setup-node
        commit: 820762786026740c76f36085b0efc47a31fe5020
        release: v7.0.0
      # The action that installs pnpm, the Node.js of devEngines.runtime of package.json or of the
      # matrix, and the packages of pnpm-lock.yaml, for the package manager pnpm.
      setup-pnpm:
        uses: pnpm/setup
        commit: a0881977cd8ea73b1ed212236c99ca10dcc80cf4
        release: v3.1.1
    runners: []
    versions: []
    # The steps that each job of the toolchain runs after the setup of the toolchain and before
    # ergon, such as the installation of a compiler that the tests run. A step has the keys name,
    # id, if and env, and either uses with its inputs under with, or run. uses is an action as uses,
    # commit and release, and each input is a string. run is the list of the lines of a command of
    # bash.
    steps: []
    timeout: 30
javascript:
  # The steps that check-javascript runs, in order: lint, test, generate or audit. lint runs lint-js
  # of the section js, and audit runs audit-js.
  check: [lint, test, audit]
  # test-javascript runs the tests with args: the test script of package.json through the package
  # manager of the section js, or vp test --run for the toolkit vite-plus.
  test:
    args: []
  # generate-javascript runs command with args at the root of the repository, such as npm run
  # generate. verify-generate-javascript, the step generate of check, runs the same and fails when
  # the run changes a file of the repository. Without a command JavaScript has neither target.
  generate:
    command: []
    args: []
typescript:
  # The tools of the targets of TypeScript, as <package>@<version> of npm, which ergon tool run
  # starts with the package manager of the section js.
  tools:
    # The type checker of lint-typescript, tsc, with its type-safety options, for the toolkit biome.
    typescript: typescript@7.0.2
  # The steps that check-typescript runs, in order: lint, test, generate or audit. lint runs lint-js
  # of the section js, and then tsc for the toolkit biome. audit runs audit-js.
  check: [lint, test, audit]
  # test-typescript runs the tests with args: the test script of package.json through the package
  # manager of the section js, or vp test --run for the toolkit vite-plus.
  test:
    args: []
  # generate-typescript runs command with args at the root of the repository, such as npm run
  # generate. verify-generate-typescript, the step generate of check, runs the same and fails when
  # the run changes a file of the repository. Without a command TypeScript has neither target.
  generate:
    command: []
    args: []
